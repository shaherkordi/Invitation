<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Wishes for Mohamed &amp; Maryam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Jost:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#F6F1EA; --ink:#2B2824; --muted:#7C746A; --gold:#B08A4E; --gold-soft:#E2D2B2; --sage:#56634A; --line:rgba(43,40,36,.14);
    --n1:#FFFDF8; --n2:#F7E6E0; --n3:#EFE5D3; --shadow:rgba(80,55,25,.22);
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --paper:#1E1C19; --ink:#EDE6D8; --muted:#B3AA98; --gold:#D4B47A; --gold-soft:#5A4B30; --sage:#8E9E7C; --line:rgba(237,230,216,.16);
    --n1:#2A2722; --n2:#33282A; --n3:#2F2A22; --shadow:rgba(0,0,0,.5); } }
  :root[data-theme="dark"] {
    --paper:#1E1C19; --ink:#EDE6D8; --muted:#B3AA98; --gold:#D4B47A; --gold-soft:#5A4B30; --sage:#8E9E7C; --line:rgba(237,230,216,.16);
    --n1:#2A2722; --n2:#33282A; --n3:#2F2A22; --shadow:rgba(0,0,0,.5); }
  [hidden] { display:none !important; }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }
  *, *::before, *::after { box-sizing:inherit; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"Cormorant Garamond", Georgia, serif; font-size:19px; line-height:1.6; min-height:100vh; }
  button, input, select { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
  .wrap { max-width:1080px; margin:0 auto; padding:0 22px 80px; }
  .sans { font-family:"Jost", Arial, sans-serif; font-weight:300; }

  /* Header */
  header { text-align:center; padding:56px 0 18px; }
  .names { font-family:"Pinyon Script", "Snell Roundhand", cursive; font-weight:400; font-size:clamp(2.8rem, 10vw, 4.6rem); line-height:1.05; margin:0; color:var(--ink); }
  .names span { color:var(--gold); font-size:.6em; padding:0 .15em; }
  .sub { font-style:italic; font-size:1.3rem; color:var(--muted); margin:6px 0 0; }
  .ornament { display:flex; align-items:center; gap:14px; width:min(70%, 300px); margin:22px auto; color:var(--gold); }
  .ornament::before, .ornament::after { content:""; flex:1; height:1px; background:var(--gold-soft); }

  /* Summary line */
  .summary { text-align:center; max-width:640px; margin:0 auto 34px; font-size:1.35rem; line-height:1.55; }
  .summary b { font-weight:500; color:var(--gold); font-style:normal; }

  /* Toolbar */
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:12px 0; margin-bottom:34px; }
  .tabs, .tools { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .chip { font-family:"Jost", Arial, sans-serif; font-size:.85rem; font-weight:400; padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:transparent; cursor:pointer; }
  .chip[aria-pressed="true"] { background:var(--sage); border-color:var(--sage); color:#fff; }
  .chip .ct { opacity:.7; margin-left:4px; }
  .search { font-family:"Jost", Arial, sans-serif; font-size:.9rem; font-weight:300; border:0; border-bottom:1px solid var(--line); background:transparent; padding:7px 2px; width:170px; }
  .search:focus { outline:none; border-bottom-color:var(--gold); }
  .icon { width:38px; height:38px; display:inline-grid; place-items:center; border-radius:50%; border:1px solid var(--line); background:transparent; cursor:pointer; }
  .icon svg { width:17px; height:17px; }
  .icon.spin svg { animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Wishes wall */
  .wall { columns:3 300px; column-gap:26px; }
  .note { break-inside:avoid; margin:0 0 26px; padding:30px 28px 24px; position:relative; background:var(--n1);
          box-shadow:0 1px 0 var(--line), 0 18px 30px -24px var(--shadow); transform:rotate(var(--tilt,0deg)); border-radius:3px; }
  .note:nth-child(3n+2) { background:var(--n2); }
  .note:nth-child(3n) { background:var(--n3); }
  .note::before { content:"\201C"; position:absolute; top:-6px; left:18px; font-size:4.2rem; line-height:1; color:var(--gold); opacity:.55; font-family:"Cormorant Garamond", serif; }
  .note.rtl::before { left:auto; right:18px; content:"\201D"; }
  .note p.msg { margin:0 0 18px; font-size:1.22rem; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; }
  .note p.msg.ar { font-family:"Amiri", serif; font-size:1.3rem; line-height:2; }
  .sig { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; border-top:1px dashed var(--gold-soft); padding-top:12px; }
  .sig .who { font-family:"Pinyon Script", cursive; font-size:1.75rem; line-height:1.1; color:var(--ink); }
  .sig .who.ar { font-family:"Amiri", serif; font-size:1.25rem; font-weight:700; }
  .sig .meta { font-family:"Jost", Arial, sans-serif; font-size:.74rem; font-weight:300; color:var(--muted); text-align:end; line-height:1.5; white-space:nowrap; }
  .tag { display:inline-block; padding:1px 9px; border-radius:999px; border:1px solid var(--sage); color:var(--sage); margin-bottom:3px; }
  .tag.no { border-color:var(--gold); color:var(--gold); }
  .note mark { background:var(--gold-soft); color:inherit; border-radius:2px; }

  /* Guest list */
  .listwrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-family:"Jost", Arial, sans-serif; font-weight:300; font-size:.95rem; min-width:560px; }
  th { text-align:start; font-weight:500; font-size:.8rem; color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--line); }
  td { padding:12px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.nm { font-family:"Cormorant Garamond", serif; font-size:1.15rem; font-weight:500; }
  td.num { text-align:center; }
  tfoot td { font-weight:500; border-bottom:0; }

  .empty { text-align:center; color:var(--muted); font-style:italic; font-size:1.25rem; padding:60px 10px; }
  .banner { font-family:"Jost", Arial, sans-serif; font-size:.85rem; font-weight:300; text-align:center; background:var(--gold-soft); color:var(--ink); padding:9px 14px; border-radius:999px; max-width:560px; margin:0 auto 26px; }
  .updated { text-align:center; font-family:"Jost", Arial, sans-serif; font-size:.78rem; font-weight:300; color:var(--muted); margin-top:30px; }

  /* Lock screen */
  #lock { min-height:70vh; display:grid; place-items:center; text-align:center; }
  #lock form { width:min(100%, 340px); }
  #lock p { color:var(--muted); font-style:italic; font-size:1.2rem; }
  #lock input { width:100%; text-align:center; font-size:1.3rem; letter-spacing:.2em; border:0; border-bottom:1px solid var(--line); background:transparent; padding:10px; margin:10px 0 22px; }
  #lock input:focus { outline:none; border-bottom-color:var(--gold); }
  .btn { font-family:"Jost", Arial, sans-serif; font-size:.95rem; padding:13px 30px; border-radius:999px; border:1px solid var(--sage); background:var(--sage); color:#fff; cursor:pointer; }
  .btn.ghost { background:transparent; color:var(--ink); border-color:var(--line); }
  #lockErr { color:var(--gold); min-height:1.5em; font-family:"Jost", Arial, sans-serif; font-size:.85rem; font-style:normal; }

  /* Read one by one */
  #reader { position:fixed; inset:0; z-index:20; background:var(--paper); display:none; flex-direction:column; align-items:center; justify-content:center; padding:calc(30px + env(safe-area-inset-top,0px)) 24px calc(30px + env(safe-area-inset-bottom,0px)); text-align:center; }
  #reader.on { display:flex; }
  #reader .card { max-width:640px; width:100%; max-height:70vh; overflow-y:auto; }
  #reader .rmsg { font-size:clamp(1.4rem, 3.6vw, 2rem); line-height:1.55; font-style:italic; margin:0 0 26px; white-space:pre-wrap; overflow-wrap:anywhere; }
  #reader .rmsg.ar { font-family:"Amiri", serif; font-style:normal; line-height:2; }
  #reader .rwho { font-family:"Pinyon Script", cursive; font-size:2.6rem; color:var(--gold); line-height:1.1; }
  #reader .rwho.ar { font-family:"Amiri", serif; font-size:1.7rem; font-weight:700; }
  #reader .rnav { display:flex; gap:12px; align-items:center; margin-top:34px; font-family:"Jost", Arial, sans-serif; font-size:.85rem; color:var(--muted); }
  #reader .close { position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); right:16px; }
  #reader .card { animation:none; }
  #reader .card.turn { animation:turn .5s ease; }
  @keyframes turn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

  @media (prefers-reduced-motion: reduce) { #reader .card.turn, .icon.spin svg { animation:none; } }
  @media (max-width:600px) { .search { width:100%; } .tools { width:100%; } .note { transform:none; } }

  @media print {
    :root { --paper:#fff; --n1:#fff; --n2:#fff; --n3:#fff; }
    .bar, .banner, .updated, #reader, .no-print { display:none !important; }
    .note { box-shadow:none; border:1px solid #ddd; transform:none; }
    .wall { columns:2; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="names">Mohamed<span>&amp;</span>Maryam</h1>
    <p class="sub">Wishes from the people who love you</p>
    <div class="ornament" aria-hidden="true">✦</div>
  </header>

  <section id="lock" hidden>
    <form id="lockForm">
      <p>Enter the passcode the couple shared with you.</p>
      <label for="pass" class="sans" style="position:absolute;left:-9999px">Passcode</label>
      <input id="pass" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Open the wishes</button>
      <p id="lockErr" role="alert"></p>
    </form>
  </section>

  <main id="app" hidden>
    <div class="banner" id="demoBanner" hidden>This is a preview filled with sample wishes. Your real guests’ words appear once the page is connected.</div>
    <p class="summary" id="summary"></p>

    <div class="bar">
      <div class="tabs" role="group" aria-label="View">
        <button class="chip" data-tab="wishes" aria-pressed="true">Wishes <span class="ct" id="ctW"></span></button>
        <button class="chip" data-tab="list" aria-pressed="false">Guest list <span class="ct" id="ctL"></span></button>
      </div>
      <div class="tools">
        <div class="tabs" role="group" aria-label="Filter">
          <button class="chip" data-f="all" aria-pressed="true">Everyone</button>
          <button class="chip" data-f="yes" aria-pressed="false">Coming</button>
          <button class="chip" data-f="no" aria-pressed="false">Can’t come</button>
        </div>
        <input class="search" id="q" type="search" placeholder="Search a name or word" aria-label="Search">
        <button class="icon" id="readBtn" title="Read one by one" aria-label="Read wishes one by one"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg></button>
        <button class="icon" id="sortBtn" title="Newest first" aria-label="Change order"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg></button>
        <button class="icon" id="csvBtn" title="Download as spreadsheet (CSV)" aria-label="Download as CSV"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg></button>
        <button class="icon" id="printBtn" title="Print as a keepsake" aria-label="Print"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M7 14h10v7H7z"/></svg></button>
        <button class="icon" id="refreshBtn" title="Check for new wishes" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
      </div>
    </div>

    <div id="wishesView"><div class="wall" id="wall"></div></div>
    <div id="listView" hidden><div class="listwrap"><table id="table"></table></div></div>
    <p class="updated"><span id="updated"></span> <button class="btn ghost no-print" id="logout" style="padding:6px 14px;font-size:.75rem;margin-left:8px">Lock</button></p>
  </main>
</div>

<div id="reader" role="dialog" aria-modal="true" aria-label="Reading wishes">
  <button class="icon close" id="rClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="card" id="rCard"><p class="rmsg" id="rMsg"></p><div class="rwho" id="rWho"></div></div>
  <div class="rnav"><button class="btn ghost" id="rPrev">Previous</button><span id="rPos"></span><button class="btn" id="rNext">Next</button></div>
</div>

<script>
(function(){
  /* ---------- settings ----------
     API_URL: the same Google Apps Script "Web app" URL you put in index.html.
     Leave empty to see the page with sample wishes. */
  const API_URL = "https://script.google.com/macros/s/AKfycbwsbVGwDkEu2zEkNWe4FKhbhS17kBhxnZ49Kiu4846u8oZrGafXacbHoX2aZqxc8ejH/exec";
  const TZ = "Africa/Cairo";

  const DEMO = [
    ["2026-10-02T18:12:00Z","Nour Hassan","yes",2,"Maryam, I have watched you dream about this day since we were twelve. Mohamed, you are the lucky one and I think you know it. Can’t wait to dance with you both!","en"],
    ["2026-10-02T20:40:00Z","خالد عبد الرحمن","yes",4,"بارك الله لكما وبارك عليكما وجمع بينكما في خير. ألف مبروك يا محمد، فرحتك فرحتنا.","ar"],
    ["2026-10-03T09:05:00Z","Salma & Omar","yes",2,"Two of our favourite people choosing each other. Wishing you a home full of laughter, late-night talks and very good coffee.","en"],
    ["2026-10-03T13:22:00Z","Aunt Hoda","no",1,"My heart will be with you even if I can’t travel. I’ll be watching every video your cousins send me. Mabrouk, habibti.","en"],
    ["2026-10-04T11:47:00Z","مي السيد","yes",1,"ربنا يتمم بخير ويسعدكم يا رب، مريم تستاهل كل الحب ده ❤️","ar"],
    ["2026-10-05T16:30:00Z","Youssef Adel","yes",3,"","en"],
    ["2026-10-06T08:15:00Z","Dina Farouk","no",1,"So sorry to miss it. Sending all my love from Dubai. May your life together be as beautiful as this invitation!","en"],
    ["2026-10-06T21:02:00Z","The Mansour family","yes",5,"From our family to yours: may every year be sweeter than the last.","en"],
    ["2026-10-07T19:44:00Z","أحمد طارق","yes",2,"ألف مبروك يا عريس! أخيرًا 😄 ربنا يسعدك ويهنيك.","ar"],
    ["2026-10-08T10:10:00Z","Laila Mostafa","yes",1,"Short and simple: I love you both. See you on the 29th!","en"]
  ].map(r=>({time:r[0],name:r[1],attending:r[2],guests:r[3],message:r[4],lang:r[5]}));

  const isDemo = !API_URL || /[?&]demo/.test(location.search);
  const $ = id => document.getElementById(id);
  const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
                  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
  const KEY_NAME = 'mm-wishes-key';
  const AR = /[\u0600-\u06FF]/;
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const hl = (s,q) => { const e=esc(s); if(!q) return e; const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'); return e.replace(re, m=>`<mark>${m}</mark>`); };
  const when = t => { try { return new Date(t).toLocaleString('en-GB',{ timeZone:TZ, day:'numeric', month:'short', hour:'numeric', minute:'2-digit' }); } catch(e){ return ''; } };

  let rows=[], tab='wishes', filter='all', q='', newest=true, passkey=store.get(KEY_NAME)||'';

  async function load(showErr){
    if (isDemo){ rows = DEMO.slice(); render(); return true; }
    const btn=$('refreshBtn'); btn.classList.add('spin');
    try{
      const r = await fetch(`${API_URL}?key=${encodeURIComponent(passkey)}&t=${Date.now()}`);
      const d = await r.json();
      if (!d.ok){ if (d.error==='key'){ lock('That passcode didn’t open the wishes. Check it with the couple and try again.'); } return false; }
      rows = d.rows || []; render(); return true;
    }catch(e){
      if (showErr) lock('Couldn’t reach the wishes. Check your connection and try again.');
      return false;
    }finally{ btn.classList.remove('spin'); }
  }

  function lock(msg){ $('app').hidden=true; $('lock').hidden=false; $('lockErr').textContent=msg||''; $('pass').focus(); }
  function unlock(){ $('lock').hidden=true; $('app').hidden=false; }

  function visible(){
    const ql=q.toLowerCase();
    let v = rows.filter(r => (filter==='all' || r.attending===filter) &&
      (!ql || (r.name+' '+r.message).toLowerCase().includes(ql)));
    v.sort((a,b)=> newest ? new Date(b.time)-new Date(a.time) : new Date(a.time)-new Date(b.time));
    return v;
  }

  function render(){
    const yes=rows.filter(r=>r.attending==='yes'), no=rows.filter(r=>r.attending!=='yes');
    const guests=yes.reduce((s,r)=>s+(+r.guests||1),0), withMsg=rows.filter(r=>r.message&&r.message.trim());
    const pl=(n,a,b)=>n===1?a:b;
    $('summary').innerHTML = rows.length
      ? `<b>${rows.length}</b> ${pl(rows.length,'reply','replies')} so far. <b>${yes.length}</b> ${pl(yes.length,'is','are')} coming, bringing <b>${guests}</b> ${pl(guests,'guest','guests')} in all${no.length?`, and <b>${no.length}</b> sent ${pl(no.length,'their','their')} love from afar`:''}. <b>${withMsg.length}</b> left you a few words to keep.`
      : `No replies yet. Wishes will appear here as soon as guests send them.`;
    $('ctW').textContent=withMsg.length; $('ctL').textContent=rows.length;

    const v=visible();
    const vm=v.filter(r=>r.message&&r.message.trim());
    $('wall').innerHTML = vm.length ? vm.map((r,i)=>{
      const arM=AR.test(r.message), arN=AR.test(r.name);
      const tilt=((i*37)%5-2)*0.35;
      return `<article class="note${arM?' rtl':''}" style="--tilt:${tilt}deg">
        <p class="msg${arM?' ar':''}" dir="auto">${hl(r.message,q)}</p>
        <div class="sig"><div class="who${arN?' ar':''}" dir="auto">${hl(r.name,q)}</div>
        <div class="meta"><span class="tag${r.attending==='yes'?'':' no'}">${r.attending==='yes'?`Coming${+r.guests>1?' with '+(r.guests-1):''}`:'Can’t come'}</span><br>${when(r.time)}</div></div>
      </article>`; }).join('')
      : `<p class="empty">${rows.length?'No wishes match this view.':'The first wish will land here.'}</p>`;

    const tg=v.filter(r=>r.attending==='yes').reduce((s,r)=>s+(+r.guests||1),0);
    $('table').innerHTML = `<thead><tr><th>Name</th><th>Reply</th><th style="text-align:center">Guests</th><th>Sent</th></tr></thead><tbody>${
      v.map(r=>`<tr><td class="nm" dir="auto">${hl(r.name,q)}</td><td>${r.attending==='yes'?'Coming':'Can’t come'}</td><td class="num">${r.attending==='yes'?r.guests:'–'}</td><td>${when(r.time)}</td></tr>`).join('')
      || `<tr><td colspan="4" class="empty" style="padding:30px">No one matches this view.</td></tr>`
    }</tbody><tfoot><tr><td>${v.length} shown</td><td></td><td class="num">${tg}</td><td></td></tr></tfoot>`;

    $('updated').textContent = isDemo ? 'Showing sample wishes' : `Updated ${new Date().toLocaleTimeString('en-GB',{hour:'numeric',minute:'2-digit'})}`;
    $('logout').hidden = isDemo;
  }

  /* controls */
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
    tab=b.dataset.tab; document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-pressed', x===b));
    $('wishesView').hidden = tab!=='wishes'; $('listView').hidden = tab!=='list'; });
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{
    filter=b.dataset.f; document.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed', x===b)); render(); });
  $('q').oninput=e=>{ q=e.target.value.trim(); render(); };
  $('sortBtn').onclick=()=>{ newest=!newest; $('sortBtn').title=newest?'Newest first':'Oldest first'; render(); };
  $('refreshBtn').onclick=()=>load(false);
  $('printBtn').onclick=()=>window.print();
  $('csvBtn').onclick=()=>{
    const cell=s=>`"${String(s==null?'':s).replace(/"/g,'""')}"`;
    const csv='\uFEFF'+[['Time','Name','Attending','Guests','Message'].join(','), ...visible().map(r=>[when(r.time),r.name,r.attending,r.guests,r.message].map(cell).join(','))].join('\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download='mohamed-maryam-wishes.csv'; document.body.appendChild(a); a.click(); a.remove();
  };
  $('logout').onclick=()=>{ store.del(KEY_NAME); passkey=''; rows=[]; $('pass').value=''; lock(''); };
  $('lockForm').onsubmit=async e=>{
    e.preventDefault(); passkey=$('pass').value.trim(); $('lockErr').textContent='Opening…';
    unlock(); if (await load(true)) store.set(KEY_NAME, passkey); };

  /* read one by one */
  let rList=[], rI=0;
  function rShow(){
    const r=rList[rI]; if(!r) return;
    $('rMsg').textContent=r.message; $('rMsg').className='rmsg'+(AR.test(r.message)?' ar':''); $('rMsg').dir='auto';
    $('rWho').textContent='— '+r.name; $('rWho').className='rwho'+(AR.test(r.name)?' ar':''); $('rWho').dir='auto';
    $('rPos').textContent=`${rI+1} of ${rList.length}`;
    $('rPrev').disabled=rI===0; $('rNext').textContent = rI===rList.length-1 ? 'Close' : 'Next';
    const c=$('rCard'); c.classList.remove('turn'); void c.offsetWidth; c.classList.add('turn');
  }
  function rClose(){ $('reader').classList.remove('on'); $('readBtn').focus(); }
  $('readBtn').onclick=()=>{ rList=visible().filter(r=>r.message&&r.message.trim()); if(!rList.length) return; rI=0; $('reader').classList.add('on'); rShow(); $('rNext').focus(); };
  $('rPrev').onclick=()=>{ if(rI>0){ rI--; rShow(); } };
  $('rNext').onclick=()=>{ if(rI<rList.length-1){ rI++; rShow(); } else rClose(); };
  $('rClose').onclick=rClose;
  addEventListener('keydown',e=>{ if(!$('reader').classList.contains('on')) return;
    if(e.key==='Escape') rClose(); if(e.key==='ArrowRight') $('rNext').click(); if(e.key==='ArrowLeft') $('rPrev').click(); });

  /* start */
  if (isDemo){ $('demoBanner').hidden=false; unlock(); load(); }
  else if (passkey){ unlock(); load(true); }
  else lock('');
  if (!isDemo) setInterval(()=>{ if(!$('app').hidden && !document.hidden) load(false); }, 60000);
})();
</script>
</body>
</html>
